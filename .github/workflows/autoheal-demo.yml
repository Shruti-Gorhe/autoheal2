name: AutoHeal Demo Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'sample-repo/**'
      - '.github/workflows/autoheal-demo.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest
      - name: Run sample tests
        run: pytest -q sample-repo/tests
